name: Build WormX APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Update Gradle and Build
      run: |
        # Check and extract zip if present
        if [ -f "WormX-android-project.zip" ]; then
          echo "Extracting WormX-android-project.zip..."
          unzip -q WormX-android-project.zip -d extracted_src
        fi

        # Find gradle-wrapper.properties and update gradle version to 7.5
        PROP_FILE=$(find . -name "gradle-wrapper.properties" -print -quit)
        if [ -n "$PROP_FILE" ]; then
          echo "Updating gradle-wrapper.properties to Gradle 7.5..."
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-7.5-bin.zip" > "$PROP_FILE"
        fi

        # Find gradlew file
        GRADLE_PATH=$(find . -name "gradlew" -type f -print -quit)
        if [ -n "$GRADLE_PATH" ]; then
          PROJECT_DIR=$(dirname "$GRADLE_PATH")
          cd "$PROJECT_DIR"
        else
          BUILD_FILE=$(find . -name "build.gradle*" -type f -print -quit)
          if [ -n "$BUILD_FILE" ]; then
            cd "$(dirname "$BUILD_FILE")"
            gradle wrapper --gradle-version 7.5
          fi
        fi

        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WormX-Debug-APK
        path: "**/outputs/apk/debug/app-debug.apk"
