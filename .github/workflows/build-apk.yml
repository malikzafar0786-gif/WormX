name: Build WormX APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Find and Build with Gradle
      run: |
        # Find where gradlew is located and run it
        GRADLE_PATH=$(find . -name "gradlew" -type f -print -quit)
        if [ -z "$GRADLE_PATH" ]; then
          echo "Error: gradlew not found!"
          exit 1
        fi
        PROJECT_DIR=$(dirname "$GRADLE_PATH")
        echo "Found gradlew in: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WormX-Debug-APK
        path: "**/outputs/apk/debug/app-debug.apk"
