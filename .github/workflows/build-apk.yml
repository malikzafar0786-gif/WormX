name: Build WormX APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Extract, Setup and Build
      run: |
        # Check and extract zip if present
        if [ -f "WormX-android-project.zip" ]; then
          echo "Extracting WormX-android-project.zip..."
          unzip -q WormX-android-project.zip -d extracted_src
        fi

        # Find gradlew file
        GRADLE_PATH=$(find . -name "gradlew" -type f -print -quit)
        
        if [ -z "$GRADLE_PATH" ]; then
          echo "gradlew missing, installing system gradle and generating wrapper..."
          sudo apt-get update && sudo apt-get install -y gradle
          BUILD_FILE=$(find . -name "build.gradle*" -type f -print -quit)
          if [ -n "$BUILD_FILE" ]; then
            cd "$(dirname "$BUILD_FILE")"
            gradle wrapper
          else
            echo "Error: build.gradle not found anywhere!"
            exit 1
          fi
        else
          PROJECT_DIR=$(dirname "$GRADLE_PATH")
          cd "$PROJECT_DIR"
        fi

        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WormX-Debug-APK
        path: "**/outputs/apk/debug/app-debug.apk"
