name: Build WormX APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
          cache-disabled: true

      - name: Locate project root (extract zip if needed)
        id: locate
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip: $ZIP_FILE — extracting..."
            unzip -o "$ZIP_FILE" -d extracted_src
          fi

          PROJECT_DIR=$(find . -maxdepth 5 -iname "settings.gradle.kts" -o -iname "settings.gradle" | head -n 1 | xargs -I{} dirname {})

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No settings.gradle(.kts) found anywhere in the repo."
            echo "Repo contents:"
            find . -maxdepth 3
            exit 1
          fi

          echo "Project root found at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WormX-debug-apk
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
